name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Offline checks (policy engine, key handling)
        run: SOMPI_SMOKE_OFFLINE=1 node dist/smoke.js
        env:
          SOMPI_DATA_DIR: /tmp/sompi-ci
